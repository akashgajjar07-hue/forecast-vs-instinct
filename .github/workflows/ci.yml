name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests on fixtures (Kaggle data not required)
        run: python -m pytest -m "not data" -q --junitxml=reports/junit-ci.xml
      - name: Scenario calculator tests (JS)
        run: node --test tests/js/
      - name: Validate dashboard JSON against the data contract
        run: python scripts/validate_docs_data.py
